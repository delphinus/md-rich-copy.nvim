name: Tests
on: [push, pull_request]
jobs:
  test:
    name: nvim ${{ matrix.nvim }}
    strategy:
      fail-fast: false
      matrix:
        # v0.10.0 is the minimum this plugin claims to support (vim.system, and the
        # first release that bundles the markdown and markdown_inline parsers).
        nvim: [v0.10.0, stable, nightly]
    # The HTML conversion is platform-independent; the clipboard is tested below.
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Report version
        run: nvim --version | head -1
      - name: Run tests
        run: make test

  clipboard:
    name: clipboard (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Report version
        run: nvim --version | head -1
      - name: Run tests
        # The runner's clipboard is throwaway, so let tests/clipboard_test.lua use it.
        run: make test
        env:
          MD_RICH_COPY_TEST_CLIPBOARD: "1"
